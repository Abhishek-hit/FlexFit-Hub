server:
  port: 8080

spring:
  application:
    name: gym-management-api

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/gym_management_db}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB

app:
  jwt:
    secret: ${JWT_SECRET:c2hoc2hzaGRnaGRnc2FoZGdzYWhkZ2FzaGRnc2FoZGdzYWhkZ2FzaGRnc2FoZGdhc2hkZ2FzaGRn}
    access-token-expiry-ms: 900000          # 15 minutes
    refresh-token-expiry-ms: 604800000      # 7 days

  otp:
    expiry-minutes: 10

  trial:
    default-days: 3

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:demo}
  api-key: ${CLOUDINARY_API_KEY:demo}
  api-secret: ${CLOUDINARY_API_SECRET:demo}

sms:
  provider: ${SMS_PROVIDER:MOCK}       # MOCK | TWILIO
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from-number: ${TWILIO_FROM_NUMBER:}

whatsapp:
  provider: ${WHATSAPP_PROVIDER:MOCK}   # MOCK | META_CLOUD_API
  meta:
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}

payment:
  gateway:
    provider: ${PAYMENT_PROVIDER:MOCK}  # MOCK | RAZORPAY
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.gymapp: INFO
    org.springframework.security: WARN
