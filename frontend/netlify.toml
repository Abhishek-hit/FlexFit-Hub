[build]
  command = "npm run build"
  publish = "dist"

# React Router (BrowserRouter) use ho raha hai, isliye jab bhi koi
# direct URL (jaise /owner/dashboard) refresh/khole, Netlify ko
# index.html hi serve karna chahiye - warna 404 aayega.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
